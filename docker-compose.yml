version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: openclaw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openclaw_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-openclaw_center}
      MYSQL_USER: ${MYSQL_USER:-openclaw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-openclaw_pass_2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openclaw-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://openclaw:openclaw_pass_2024@mysql:3306/openclaw_center
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-in-production-32-bytes!!}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads

volumes:
  mysql_data:
  upload_data:
